import time
import random
from math import *
from sympy import symbols, Eq, solve, sqrt

# --- Smooth print function ---
from browser import document as doc
output = doc["output"]
def smooth_print(text, delay=0.01):
    for char in str(text):
        output.text += char
        time.sleep(delay)
    output.text += "\n"

# --- Mini-games (examples) ---
def guess_number():
    number = random.randint(1, 100)
    smooth_print("Guess the number between 1 and 100")
    while True:
        guess = int(input("Your guess: "))
        if guess < number:
            smooth_print("Too low!")
        elif guess > number:
            smooth_print("Too high!")
        else:
            smooth_print("Correct!")
            break

# Example universal math solver
def universal_math_solver():
    smooth_print("Universal Math Solver (type 'quit' to exit)")
    x, y, a, b, c = symbols('x y a b c')
    while True:
        problem = input("Enter problem: ")
        if problem.lower() == "quit":
            break
        try:
            if any(char.isalpha() for char in problem):
                if "=" in problem:
                    left, right = problem.split("=")
                    eq = Eq(eval(left), eval(right))
                    result = solve(eq)
                else:
                    expr = eval(problem)
                    result = solve(expr)
            else:
                result = eval(problem)
            smooth_print(f"Answer: {result}")
        except Exception as e:
            smooth_print(f"Error: {e}")
